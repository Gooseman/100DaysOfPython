name: Stoic Quotes (100 Days of Python)

on:
  push:
    branches:
      - actions
  schedule:
    # Every day at 9am
    - cron: '0 9 * * *'
  
jobs:
  stoic-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '>=3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run the stoic quotes script
        run: python -m stoic_quotes.main
        working-directory: 33-StoicQuotes/src
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
