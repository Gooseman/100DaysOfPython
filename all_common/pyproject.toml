[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "100-days-common"
version = "0.1.0"
description = "Shared utilities for 100 Days of Python"
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[tool.setuptools.packages.find]
where = ["src"]